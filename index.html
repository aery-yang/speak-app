<!DOCTYPE html>
<html lang="zh-TW" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家族專屬外語口說練習 App</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        glass: {
                            light: 'rgba(255, 255, 255, 0.75)',
                            dark: 'rgba(30, 41, 59, 0.75)',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 30px 0 rgba(0, 0, 0, 0.05);
        }
        .dark .glass-card {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px 0 rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-100 via-purple-50 to-pink-100 dark:from-slate-950 dark:via-slate-900 dark:to-indigo-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col justify-between transition-colors duration-300">

    <!-- 頂部導覽列 -->
    <header class="glass-card sticky top-0 z-50 border-b border-white/20 dark:border-slate-800/50">
        <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-xl">🗣️</span>
                <h1 class="font-bold text-base tracking-wide bg-gradient-to-r from-indigo-600 to-violet-600 dark:from-indigo-400 dark:to-violet-400 bg-clip-text text-transparent">Family Speak AI</h1>
            </div>
            
            <div class="flex items-center space-x-3">
                <button id="theme-toggle" class="p-2 rounded-full glass-card hover:scale-105 transition shadow-sm" title="切換明暗模式">
                    <span id="theme-icon" class="text-sm">🌙</span>
                </button>
                
                <div id="user-info" class="text-xs hidden flex items-center space-x-2">
                    <span id="user-email" class="px-2.5 py-1 rounded-full bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-800 font-medium"></span>
                    <button id="logout-btn" class="px-3 py-1 rounded-full bg-rose-500 hover:bg-rose-600 text-white font-medium transition shadow-sm">登出</button>
                </div>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-3xl mx-auto px-4 py-8 flex-grow w-full space-y-6">

        <!-- 1. 登入 / 註冊區塊 -->
        <section id="auth-section" class="glass-card max-w-md mx-auto p-8 rounded-3xl mt-6 space-y-6">
            <div class="text-center space-y-1">
                <h2 class="text-xl font-bold text-indigo-600 dark:text-indigo-400">家族授權登入</h2>
                <p class="text-xs text-slate-500 dark:text-slate-400">請使用您的 Gmail 帳號與專屬密碼登入</p>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Gmail 信箱</label>
                    <input type="email" id="auth-email" placeholder="your-email@gmail.com" class="w-full px-4 py-2.5 bg-white/50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none text-sm transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">密碼 (首次登入即註冊)</label>
                    <input type="password" id="auth-password" placeholder="••••••••" class="w-full px-4 py-2.5 bg-white/50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none text-sm transition">
                </div>
                <div id="auth-error" class="text-rose-500 text-xs font-medium hidden text-center bg-rose-50 dark:bg-rose-950/50 p-2.5 rounded-xl border border-rose-200 dark:border-rose-900"></div>
                <button id="auth-submit-btn" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white font-medium py-3 rounded-2xl transition shadow-lg shadow-indigo-500/25 text-sm">
                    進入學習空間
                </button>
            </div>
        </section>

        <!-- 2. 口說練習主介面 -->
        <section id="app-section" class="hidden space-y-6">
            
            <!-- [僅管理者可見] 雲端 API Key 與語音設定卡片 -->
            <div id="admin-config-card" class="glass-card p-5 rounded-3xl border-amber-300/50 dark:border-amber-500/30 bg-amber-50/50 dark:bg-amber-950/20 hidden space-y-4">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-bold text-amber-700 dark:text-amber-400 uppercase tracking-wider flex items-center gap-1">👑 管理者：系統與語音設定</span>
                    <span class="text-[11px] text-amber-600 dark:text-amber-500">全家人自動同步</span>
                </div>
                
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-amber-800 dark:text-amber-300 mb-1">Gemini API Key</label>
                        <div class="flex flex-col sm:flex-row gap-2">
                            <input type="password" id="api-key-input" placeholder="貼上您的 Gemini API Key" class="w-full px-3.5 py-2 text-sm bg-white/80 dark:bg-slate-900/80 border border-amber-200 dark:border-amber-900/50 rounded-xl focus:ring-2 focus:ring-amber-500 outline-none">
                            <button id="save-key-btn" class="w-full sm:w-auto bg-amber-600 hover:bg-amber-700 text-white text-xs font-medium px-5 py-2 rounded-xl transition whitespace-nowrap shadow-sm">
                                儲存金鑰
                            </button>
                        </div>
                    </div>

                    <!-- 語音選擇與預聽設定 -->
                    <div>
                        <label class="block text-xs font-medium text-amber-800 dark:text-amber-300 mb-1">選擇朗讀語音 (TTS Voice)</label>
                        <div class="flex flex-col sm:flex-row gap-2">
                            <select id="voice-select" class="w-full px-3 py-2 text-sm bg-white/80 dark:bg-slate-900/80 border border-amber-200 dark:border-amber-900/50 rounded-xl focus:ring-2 focus:ring-amber-500 outline-none">
                                <option value="">載入系統語音中...</option>
                            </select>
                            <button id="test-voice-btn" class="w-full sm:w-auto bg-slate-700 hover:bg-slate-800 text-white text-xs font-medium px-4 py-2 rounded-xl transition whitespace-nowrap shadow-sm flex items-center justify-center gap-1">
                                <span>🔊 預聽發音</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 對話與練習主卡片 -->
            <div class="glass-card p-6 rounded-3xl space-y-4">
                <div class="flex items-center justify-between">
                    <h2 class="text-base font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2">✨ AI 口說教練與情境練習</h2>
                    <span class="text-xs px-2.5 py-1 rounded-full bg-indigo-100 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 font-medium">Gemini 1.5 Flash</span>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1.5">輸入你想練習的句子或對話情境：</label>
                    <textarea id="prompt-input" rows="3" placeholder="例如：我想練習在咖啡廳點餐的英文對話，請幫我示範與糾正..." class="w-full px-4 py-3 bg-white/50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none text-sm transition"></textarea>
                </div>
                <button id="send-ai-btn" class="w-full sm:w-auto bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white font-medium px-6 py-3 rounded-2xl transition shadow-lg shadow-indigo-500/20 text-sm flex items-center justify-center gap-2">
                    <span>開始 AI 智能分析與對話</span>
                </button>

                <!-- AI 回應結果容器 -->
                <div id="ai-result-container" class="hidden mt-4 p-5 bg-indigo-50/60 dark:bg-indigo-950/40 border border-indigo-100 dark:border-indigo-900/50 rounded-2xl space-y-3">
                    <div class="flex justify-between items-center">
                        <h3 class="text-xs font-bold text-indigo-600 dark:text-indigo-400 uppercase tracking-wider">💡 AI 教練建議與生字高亮</h3>
                        <button id="speak-result-btn" class="text-xs bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-xl transition flex items-center gap-1 shadow-sm">
                            <span>🔊 朗讀這段回答</span>
                        </button>
                    </div>
                    <div id="ai-output-content" class="text-slate-700 dark:text-slate-200 leading-relaxed text-sm whitespace-pre-wrap"></div>
                </div>
            </div>

        </section>

    </main>

    <!-- 頁尾 -->
    <footer class="text-center py-6 text-xs text-slate-400 dark:text-slate-500">
        ObsiDRAGON AI Foundation © 2026 - Family Learning Hub
    </footer>

    <!-- Firebase SDKs 與 語音/AI 邏輯 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBv5Drgh-rFyXwI9WKjTu5IFGzYYUtuSto",
            authDomain: "speak-app-b8cd5.firebaseapp.com",
            projectId: "speak-app-b8cd5",
            storageBucket: "speak-app-b8cd5.firebasestorage.app",
            messagingSenderId: "416419914046",
            appId: "1:416419914046:web:d2856fe21e681236c0cc6f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const ALLOWED_EMAILS = ["yirongyang212@gmail.com"];
        const ADMIN_EMAIL = "yirongyang212@gmail.com";

        // DOM 元素
        const authSection = document.getElementById('auth-section');
        const appSection = document.getElementById('app-section');
        const userInfo = document.getElementById('user-info');
        const userEmailSpan = document.getElementById('user-email');
        const authEmailInput = document.getElementById('auth-email');
        const authPasswordInput = document.getElementById('auth-password');
        const authSubmitBtn = document.getElementById('auth-submit-btn');
        const authError = document.getElementById('auth-error');
        const logoutBtn = document.getElementById('logout-btn');
        
        const adminConfigCard = document.getElementById('admin-config-card');
        const apiKeyInput = document.getElementById('api-key-input');
        const saveKeyBtn = document.getElementById('save-key-btn');
        const voiceSelect = document.getElementById('voice-select');
        const testVoiceBtn = document.getElementById('test-voice-btn');

        const promptInput = document.getElementById('prompt-input');
        const sendAiBtn = document.getElementById('send-ai-btn');
        const aiResultContainer = document.getElementById('ai-result-container');
        const aiOutputContent = document.getElementById('ai-output-content');
        const speakResultBtn = document.getElementById('speak-result-btn');
        
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');

        // 瀏覽器內建語音初始化
        let synth = window.speechSynthesis;
        let voices = [];

        function populateVoices() {
            voices = synth.getVoices();
            voiceSelect.innerHTML = '';
            
            // 優先過濾出英文與日、韓、中等常用外語語音
            voices.forEach((voice, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `${voice.name} (${voice.lang})`;
                if (voice.lang.includes('en') || voice.lang.includes('zh') || voice.lang.includes('ja')) {
                    voiceSelect.appendChild(option);
                }
            });

            if (voiceSelect.options.length === 0) {
                voices.forEach((voice, index) => {
                    const option = document.createElement('option');
                    option.value = index;
                    option.textContent = `${voice.name} (${voice.lang})`;
                    voiceSelect.appendChild(option);
                });
            }

            // 讀取先前儲存的語音偏好
            const savedVoiceIndex = localStorage.getItem('selected_voice_index');
            if (savedVoiceIndex !== null && savedVoiceIndex < voices.length) {
                voiceSelect.value = savedVoiceIndex;
            }
        }

        populateVoices();
        if (synth.onvoiceschanged !== undefined) {
            synth.onvoiceschanged = populateVoices;
        }

        // 預聽發音按鈕
        testVoiceBtn.addEventListener('click', () => {
            if (voices.length === 0) {
                alert('系統正在載入語音，請稍候再試...');
                return;
            }
            synth.cancel(); // 停止先前的朗讀
            const selectedIndex = voiceSelect.value;
            const utterance = new SpeechSynthesisUtterance("Hello! Welcome to your family language learning assistant. Let's practice speaking together!");
            utterance.voice = voices[selectedIndex];
            utterance.rate = 1.0; // 語速
            synth.speak(utterance);
        });

        // 儲存語音偏好至瀏覽器
        voiceSelect.addEventListener('change', () => {
            localStorage.setItem('selected_voice_index', voiceSelect.value);
        });

        // 朗讀 AI 回答按鈕
        speakResultBtn.addEventListener('click', () => {
            const textToSpeak = aiOutputContent.textContent;
            if (!textToSpeak) return;
            synth.cancel();
            const selectedIndex = voiceSelect.value || 0;
            const utterance = new SpeechSynthesisUtterance(textToSpeak);
            if (voices[selectedIndex]) {
                utterance.voice = voices[selectedIndex];
            }
            synth.speak(utterance);
        });

        // Dark Mode 切換
        const htmlElement = document.documentElement;
        if (localStorage.getItem('theme') === 'dark') {
            htmlElement.classList.add('dark');
            themeIcon.textContent = '☀️';
        }

        themeToggle.addEventListener('click', () => {
            if (htmlElement.classList.contains('dark')) {
                htmlElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                themeIcon.textContent = '🌙';
            } else {
                htmlElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                themeIcon.textContent = '☀️';
            }
        });

        // 取得雲端 API Key
        async function getCloudApiKey() {
            try {
                const docRef = doc(db, "settings", "gemini_config");
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    return docSnap.data().apiKey;
                }
            } catch (e) {
                console.error("讀取雲端金鑰失敗：", e);
            }
            return null;
        }

        // 監聽登入狀態
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                if (!ALLOWED_EMAILS.includes(user.email)) {
                    authError.textContent = "此帳號不在家族授權白名單內！";
                    authError.classList.remove('hidden');
                    signOut(auth);
                    return;
                }
                authSection.classList.add('hidden');
                appSection.classList.remove('hidden');
                userInfo.classList.remove('hidden');
                userEmailSpan.textContent = user.email;

                if (user.email === ADMIN_EMAIL) {
                    adminConfigCard.classList.remove('hidden');
                    const currentKey = await getCloudApiKey();
                    if (currentKey) apiKeyInput.value = currentKey;
                }
            } else {
                authSection.classList.remove('hidden');
                appSection.classList.add('hidden');
                userInfo.classList.add('hidden');
                adminConfigCard.classList.add('hidden');
            }
        });

        // 登入按鈕
        authSubmitBtn.addEventListener('click', async () => {
            const email = authEmailInput.value.trim();
            const password = authPasswordInput.value.trim();
            authError.classList.add('hidden');

            if (!email || !password) {
                authError.textContent = "請輸入 Email 與密碼";
                authError.classList.remove('hidden');
                return;
            }

            if (!ALLOWED_EMAILS.includes(email)) {
                authError.textContent = "此信箱未取得家族授權。";
                authError.classList.remove('hidden');
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
                    try {
                        await createUserWithEmailAndPassword(auth, email, password);
                    } catch (regError) {
                        authError.textContent = "註冊失敗：" + regError.message;
                        authError.classList.remove('hidden');
                    }
                } else {
                    authError.textContent = "登入失敗：密碼錯誤或帳號有誤。";
                    authError.classList.remove('hidden');
                }
            }
        });

        logoutBtn.addEventListener('click', () => signOut(auth));

        // 儲存金鑰到雲端
        saveKeyBtn.addEventListener('click', async () => {
            const key = apiKeyInput.value.trim();
            if (!key) { alert('請輸入有效的 API Key'); return; }
            try {
                await setDoc(doc(db, "settings", "gemini_config"), { apiKey: key });
                alert('Gemini API Key 已成功儲存至雲端資料庫！');
            } catch (err) {
                alert('儲存失敗：' + err.message);
            }
        });

        // 呼叫 Gemini AI
        sendAiBtn.addEventListener('click', async () => {
            const apiKey = await getCloudApiKey();
            const promptText = promptInput.value.trim();

            if (!apiKey) { alert('尚未設定雲端 Gemini API Key！請先由管理者帳號登入設定。'); return; }
            if (!promptText) { alert('請輸入想要練習的內容！'); return; }

            aiResultContainer.classList.remove('hidden');
            aiOutputContent.textContent = "Gemini 教練正在分析中...";

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: `你是一位專業的外語口說與生字教練。請針對使用者的輸入進行回覆、糾正文法錯誤，並將重要的實用片語或生字特別用粗體標註。使用者輸入：${promptText}`
                            }]
                        }]
                    })
                });

                const data = await response.json();
                if (data.candidates && data.candidates[0].content) {
                    aiOutputContent.textContent = data.candidates[0].content.parts[0].text;
                } else {
                    aiOutputContent.textContent = "API 回應發生錯誤，請檢查雲端 API Key 是否正確。";
                }
            } catch (err) {
                aiOutputContent.textContent = "連線失敗：" + err.message;
            }
        });
    </script>
</body>
</html>
